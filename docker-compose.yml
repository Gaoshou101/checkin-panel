# Check-in Panel - Docker Compose 快速部署
#
# 启动命令:
#   docker compose up -d && docker compose logs -f

services:
  checkin-panel:
    # 支持 Docker Hub 或 GHCR 镜像：
    #   Docker Hub: wit7zz/checkin-panel:latest
    #   GHCR:       ghcr.io/gaoshou101/checkin-panel:latest
    image: wit7zz/checkin-panel:latest
    container_name: checkin-panel
    restart: unless-stopped

    # 端口映射：宿主机端口:容器端口（面板默认监听 8000）
    ports:
      - "8000:8000"

    environment:
      # 时区：签到窗口与每日结算依赖本地时间
      TZ: Asia/Shanghai

      # 代理设置（按需启用）：
      # 支持 http://, socks5://, socks5h://
      # 用于穿透 Cloudflare Managed Challenge 或阿里云 ESA WAF
      # 示例（指向局域网 Clash / 宿主机代理）：
      # CHECKIN_PROXY_URL: http://192.168.1.100:7890
      CHECKIN_PROXY_URL: http://host.docker.internal:7897
      # 按域名单独指定分流代理（JSON 字典）：
      # CHECKIN_PROXY_OVERRIDES: '{"anyrouter.top": "http://host.docker.internal:7890"}'
      # 备用代理池（JSON 数组，未命中分流且默认代理为空时轮询）：
      # CHECKIN_PROXY_POOL: '["socks5://host.docker.internal:1080"]'

      # 人机验证自动打码（按需启用，秒过 Cloudflare Turnstile，免起重型无头浏览器）：
      # 1. CapSolver API Key (https://dashboard.capsolver.com)
      # CAPSOLVER_API_KEY: ""
      # 2. YesCaptcha Client Key (国内友好，支持支付宝充值，https://yescaptcha.com)
      # YESCAPTCHA_CLIENT_KEY: ""
      # 3. 验证码服务商优先级 (auto / capsolver / yescaptcha，默认 auto：优先 CapSolver 并自动降级)
      # TURNSTILE_SOLVER_PROVIDER: "auto"

      # 调度器：1 为开启每日自动定时签到循环，0 为仅在前端手动签到
      PANEL_SCHEDULER: "1"

      # 纯净模式：0 为彻底关闭第三方卡片与外部轮询，不产生无关网络请求
      PANEL_PROMO: "0"

    # 让 Linux 容器能够通过 host.docker.internal 访问宿主机端口与网关
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # 1. 账号数据：持久化 SQLite 数据库 (panel.db)
      - ./data:/app/data

      # 2. 会话状态：持久化 OAuth / 浏览器登录生成的 Profile 与 Cookies
      - ./profiles:/app/.browser_profiles

      # 💡 提示：Chromium 自动化浏览器已预置于镜像内 (/opt/cloakbrowser)，
      # 首次启动立即可用，无需额外挂载或在线下载几百兆浏览器内核。
